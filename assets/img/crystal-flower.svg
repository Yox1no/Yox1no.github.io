<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- 水晶花 - 爱莉希雅的象征，三瓣花设计 -->
  <g transform="translate(96,96)" fill="none" stroke="#ff69b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 花瓣1 - 右上 -->
    <path d="M0,-15 C10,-50 35,-60 40,-35 C45,-10 20,5 0,0" fill="rgba(255,105,180,0.25)"/>
    <path d="M0,-15 C10,-50 35,-60 40,-35 C45,-10 20,5 0,0" fill="none" stroke="#ff69b4" stroke-width="3"/>
    
    <!-- 花瓣2 - 左下 -->
    <path d="M-8,10 C-35,15 -55,40 -35,50 C-15,60 5,30 0,15" fill="rgba(255,105,180,0.25)"/>
    <path d="M-8,10 C-35,15 -55,40 -35,50 C-15,60 5,30 0,15" fill="none" stroke="#ff69b4" stroke-width="3"/>
    
    <!-- 花瓣3 - 右下 -->
    <path d="M8,10 C30,20 50,5 40,-15 C30,-35 5,-10 0,0" fill="rgba(255,105,180,0.25)"/>
    <path d="M8,10 C30,20 50,5 40,-15 C30,-35 5,-10 0,0" fill="none" stroke="#ff69b4" stroke-width="3"/>
    
    <!-- 花蕊光点 -->
    <circle cx="0" cy="0" r="6" fill="#ff69b4" opacity="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#ffb6c1" opacity="0.8"/>
    
    <!-- 花瓣脉络装饰线 -->
    <line x1="0" y1="-5" x2="18" y2="-32" stroke="#ff69b4" stroke-width="1.5" opacity="0.4"/>
    <line x1="-3" y1="5" x2="-22" y2="32" stroke="#ff69b4" stroke-width="1.5" opacity="0.4"/>
    <line x1="3" y1="5" x2="22" y2="15" stroke="#ff69b4" stroke-width="1.5" opacity="0.4"/>
    
    <!-- 水晶光泽 - 小闪光点 -->
    <circle cx="12" cy="-25" r="2" fill="#ffb6c1" opacity="0.6"/>
    <circle cx="-18" cy="25" r="1.5" fill="#ffb6c1" opacity="0.5"/>
    <circle cx="18" cy="8" r="1.5" fill="#ffb6c1" opacity="0.5"/>
    
    <!-- 外围水晶光晕 -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(255,105,180,0.15)" stroke-width="1"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="rgba(255,105,180,0.08)" stroke-width="1"/>
  </g>
</svg>
